name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # the community palettes' index is generated by the build: a file added without it fails here
      - run: git diff --exit-code -- packages/tokens/src/palettes/community/index.ts
      - run: pnpm check
      - run: node tools/release/check.mjs --release
      - uses: actions/upload-artifact@v7
        with:
          name: custom_components-fluvy
          path: custom_components/fluvy
          if-no-files-found: error
          retention-days: 7

  python:
    name: Integration (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install ruff
      - run: ruff check custom_components
      - run: ruff format --check custom_components

  visual:
    name: Measurer and interactions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fluvy/render exec playwright install --with-deps chromium
      - name: Start the playground
        run: |
          FLUVY_NO_HMR=1 pnpm --filter @fluvy/playground dev > playground.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5183/ > /dev/null && break; sleep 1; done
      - run: pnpm visual
      # every card's declared height is what it draws at 360 (`layoutHeight`, read with the house as the automatic
      # dashboard reads it): nothing but the known drifts (tools/render/known-heights.json), and every known one still there
      - run: node tools/render/heights.mjs
      # the measurer's self-test: each rule still breaks on its fixture, and nothing breaks on the clean one
      - run: node tools/render/measure-fixtures.mjs --out out/measure
      # every sheet and panel tab at the page widths 360, 412 and 1400 and the card widths 152, 172, 211 and 266:
      # nothing but the known violations (tools/render/known-violations.json), and every known one still there
      - run: pnpm measure --out out/measure --jobs 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-reports
          path: |
            out
            playground.log

  narrow:
    name: Narrow columns in every language
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @fluvy/render exec playwright install --with-deps chromium
      - name: Start the playground
        run: |
          FLUVY_NO_HMR=1 pnpm --filter @fluvy/playground dev > playground.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5183/ > /dev/null && break; sleep 1; done
      # every sheet in every language the catalogue speaks, at the card widths: half-section cards at 152 and 172, full
      # cards at the 211 floor and at 266, where a long word is cut, broken or laid over its neighbour first. A job of
      # its own, beside the one above, so the two take the time of one
      - run: pnpm measure:narrow --out out/measure-narrow --jobs 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: narrow-reports
          path: |
            out
            playground.log
